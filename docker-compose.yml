services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
      POSTGRES_DB: trading
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Migrations are mounted as INDIVIDUAL files (not the whole directory):
      # a directory mount over /docker-entrypoint-initdb.d would shadow the
      # timescale image's own 000_install_timescaledb.sh (CREATE EXTENSION)
      # and 001_timescaledb_tune.sh, and 002's create_hypertable() would fail.
      # When adding migrations/00X_*.sql, add a matching line here.
      - ./migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
      - ./migrations/002_system_state_and_bars.sql:/docker-entrypoint-initdb.d/002_system_state_and_bars.sql:ro
      - ./migrations/003_backtests.sql:/docker-entrypoint-initdb.d/003_backtests.sql:ro
      - ./migrations/004_portfolio.sql:/docker-entrypoint-initdb.d/004_portfolio.sql:ro
      - ./migrations/005_orders.sql:/docker-entrypoint-initdb.d/005_orders.sql:ro
      - ./migrations/006_recommendations_evidence.sql:/docker-entrypoint-initdb.d/006_recommendations_evidence.sql:ro
      - ./migrations/007_stock_bars_daily.sql:/docker-entrypoint-initdb.d/007_stock_bars_daily.sql:ro
      - ./migrations/008_option_execution.sql:/docker-entrypoint-initdb.d/008_option_execution.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://trading:trading@db:5432/trading
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../ui
      dockerfile: Dockerfile
    environment:
      # The browser (not the container) calls the API, so the base URL is the
      # host-published gateway port, baked in at page load via NEXT_PUBLIC_*.
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - gateway

volumes:
  db-data:
