[project]
name = "trading-platform-backend"
version = "0.1.0"
description = "Systematic options trading platform — backend services"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    # RUNTIME, not just tests: every real provider talks HTTP over httpx —
    # the OpenAI/Anthropic recommendation providers and the Alpaca broker
    # adapter. Leaving it under [dev] made the production image start fine and
    # then fail the moment a provider was actually constructed.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["libs*", "apps*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
